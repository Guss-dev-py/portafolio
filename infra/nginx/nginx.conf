server {
    # Puerto FIJO del contenedor. No es ${FRONTEND_PORT}: la imagen corre como
    # uid 101 y no puede bindear puertos <1024, así que el puerto elegible es
    # el del host, y ese lo publica el compose. Ver Dockerfile.frontend.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    # `application/xml` es por el sitemap; `text/plain` ya cubre robots.txt.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    # Sin esto nginx usa nivel 1, el más liviano: el chunk principal viajaba a
    # 148 kB cuando el mismo contenido comprimido a nivel 6 son 128 kB. El
    # costo de CPU es despreciable para assets estáticos con `expires 1y`, que
    # además se comprimen una vez por versión y quedan en cache del cliente.
    gzip_comp_level 6;

    # Assets con cache largo
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy de API al contenedor backend
    location /api {
        proxy_pass http://backend:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El admin no se indexa. En una SPA no se puede resolver con un
    # <meta name="robots"> porque hay un solo index.html para todas las rutas:
    # el meta afectaría también al sitio público. Va por header.
    #
    # `always` es necesario para que el header salga también en respuestas que
    # no son 2xx. El robots.txt ya tiene Disallow: /admin — esto cubre el caso
    # de que la URL llegue por un link externo, donde el Disallow no alcanza
    # porque impide crawlear pero no indexar.
    # ⚠️ Ojo con la forma del try_files. La versión intuitiva
    #     try_files $uri $uri/ /index.html;
    # NO funciona acá: cuando `/index.html` es el ÚLTIMO parámetro, nginx lo
    # trata como internal redirect al `location /`, la respuesta se genera en
    # ese otro contexto y el add_header de este bloque se pierde en silencio.
    # Verificado: devolvía 200 sin el header.
    #
    # Con `=404` al final, `/index.html` pasa a ser una comprobación de archivo
    # y se sirve desde este mismo location, así que el header sí sale. Las
    # rutas de /admin son todas del router, nunca archivos reales, así que no
    # se pierde nada por no chequear $uri.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # robots.txt y sitemap.xml son archivos reales en public/, así que Vite los
    # copia a la raíz del build y `try_files` los encuentra antes del fallback.
    # Se les niega el cache largo del bloque de assets de arriba: no llevan
    # hash en el nombre y tienen que poder actualizarse sin esperar un año.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback — crítico para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
