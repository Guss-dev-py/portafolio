name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest --run

  backend:
    name: Backend — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest --run
        env:
          DATABASE_URL: postgresql://portfolio_user:test@localhost:5432/portfolio
          JWT_SECRET: test-secret-ci
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$placeholder
          PORT: "3001"
          CORS_ORIGIN: http://localhost:5173
          RESEND_API_KEY: re_test
          RECIPIENT_EMAIL: test@example.com
